        :root {
            /* Core Colors */
            --primary: #222;
            --accent: #e74c3c;
            --bg: #fdfdfd;
            --paper: #ffffff;
            --text: #333;
            --gray: #666;
            --header-bg: #f4f4f4;

            /* Genre Colors */
            --c-pop: #25d1da;
            --c-rock: #c0392b; 
            --c-rnb: #a55eea;
            --c-elec: #2ed573;
            --c-country: #ffa502;
            --c-jazz: #eccc68;
            --c-indie: #ff9ff3;
            --c-genreless: linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%);
        }

        body {
            background-color: #555;
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 40px;
            color: var(--text);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page-container {
            background: var(--paper);
            max-width: 210mm;
            margin: 0 auto;
            padding: 20mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 297mm;
            position: relative;
        }

        /* HEADER */
        .cover-page {
            text-align: center;
            border-bottom: 4px double var(--primary);
            padding-bottom: 40px;
            margin-bottom: 40px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 10px;
            font-weight: 700;
        }

        /* LAYOUT */
        .tier-section { margin-bottom: 40px; break-inside: avoid; }
        .tier-header {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary);
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 30px;
            margin-top: 0;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px 40px; /* Reduced vertical gap */
        }
        .artist-entry {
            break-inside: avoid;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .img-frame {
            width: 100%; height: 200px; background: #eee;
            overflow: hidden; border-radius: 4px; margin-bottom: 12px;
            border: 1px solid #ddd;
        }
        .img-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }

        .header-row {
            display: flex; align-items: baseline; justify-content: space-between;
            margin-bottom: 8px; flex-wrap: wrap;
        }
        .artist-name {
            font-family: 'Playfair Display', serif; font-size: 1.6rem;
            margin: 0; color: var(--primary); line-height: 1;
        }
        .country-name {
            font-size: 0.85rem; text-transform: uppercase;
            color: var(--gray); font-weight: 700; letter-spacing: 0.5px;
        }

        /* GENRES */
        .genre-box { margin-bottom: 12px; }
        .genre-tag {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 0.65rem; font-weight: bold; color: #000;
            margin-right: 5px; text-transform: uppercase;
        }
        .g-Pop { background-color: var(--c-pop); }
        .g-Rock { background-color: var(--c-rock); color: white; }
        .g-RB { background-color: var(--c-rnb); color: white; }
        .g-Electronic { background-color: var(--c-elec); }
        .g-Country { background-color: var(--c-country); }
        .g-Jazz { background-color: var(--c-jazz); }
        .g-Indie { background-color: var(--c-indie); }
        .g-Genreless { background: var(--c-genreless); color: white; }

        .section-header {
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
            margin-top: 10px; margin-bottom: 4px;
            background-color: var(--header-bg); color: #444;
            padding: 4px 8px; border-radius: 4px; display: inline-block;
            border-left: 3px solid #ccc;
        }

        .similar-list { font-size: 0.85rem; margin: 0; color: #555; line-height: 1.4; padding-left: 8px; }
        .track-list { font-size: 0.9rem; margin: 0; color: #333; line-height: 1.5; padding-left: 8px; }
        
        .track-num { font-style: normal; color: #888; font-size: 0.8rem; margin-right: 4px; }
        .track-title { font-style: italic; font-weight: 600; }

        /* Highlight Hits */
        .special-hit-wrapper {
            display: block; margin-top: 4px; padding-top: 4px;
            border-top: 1px dotted #eee;
        }
        .japan-hit-wrapper {
            display: block; margin-bottom: 4px; padding-bottom: 4px;
            border-bottom: 1px dotted #eee;
        }
        
        .japan-label { font-style: normal; font-weight: bold; color: var(--accent); font-size: 0.8rem; }
        .fumi-label { font-style: normal; font-weight: bold; color: #8e44ad; font-size: 0.8rem; } /* Purple */

        /* CONTROLS */
        .controls { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .btn-print {
            background: var(--accent); color: white; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-size: 1rem; transition: transform 0.2s;
        }
        .btn-print:hover { transform: scale(1.05); }

        @media print {
            body { background: none; padding: 0; }
            .page-container { width: 100%; max-width: none; box-shadow: none; margin: 0; padding: 0; }
            .controls { display: none; }
            .catalog-grid { display: block; column-count: 2; column-gap: 40px; }
            .artist-entry { display: inline-block; width: 100%; }
            .tier-header { break-after: avoid; }
        }
    </style>

    // --- RENDER LOGIC BY TIER ---
    const contentDiv = document.getElementById('catalog-content');

    const tiers = [
        { id: "Imperial", label: "👑 IMPERIAL (Global Icons)" },
        { id: "A-List", label: "🌟 A-LIST (Radio Hits)" },
        { id: "Cult", label: "🎸 CULT & BANDS" },
        { id: "Regional", label: "🌏 REGIONAL KINGS (Asia)" },
        { id: "Indie", label: "☕ INDIE & VIBE" },
        { id: "Niche", label: "💎 NICHE / DEVELOPING" }
    ];

    tiers.forEach(tierObj => {
        // 1. Filter
        const tierArtists = db.filter(a => a.tier === tierObj.id);

        // 2. Sort: Solo First, Groups Last
        tierArtists.sort((a, b) => {
            if (a.isGroup !== b.isGroup) {
                return a.isGroup ? 1 : -1;
            }
            return 0; // Keep original order otherwise
        });

        if (tierArtists.length > 0) {
            const section = document.createElement('div');
            section.className = 'tier-section';

            const header = document.createElement('h2');
            header.className = 'tier-header';
            header.innerText = tierObj.label;
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'catalog-grid';

            tierArtists.forEach(artist => {
                const div = document.createElement('div');
                div.className = 'artist-entry';

                // Genres
                const genres = Array.isArray(artist.genres) ? artist.genres : [artist.genre];
                let genreHtml = genres.map(g => {
                    let className = 'genre-tag';
                    if (g === 'Pop') className += ' g-Pop';
                    else if (g === 'Rock') className += ' g-Rock';
                    else if (g === 'R&B') className += ' g-RB';
                    else if (g === 'Electronic') className += ' g-Electronic';
                    else if (g === 'Country') className += ' g-Country';
                    else if (g === 'Jazz') className += ' g-Jazz';
                    else if (g === 'Indie') className += ' g-Indie';
                    else if (g === 'Genreless') className += ' g-Genreless';
                    else className += ' g-Pop'; 
                    return `<span class="${className}">${g}</span>`;
                }).join("");

                // Tracks
                const trackHtml = artist.essentials.map((t, i) => `<div><span class="track-num">${i+1}.</span> <span class="track-title">${t}</span></div>`).join("");

                // Dynamic Pick Label
                // Use plural if comma exists AND it's not Knox (Edge Case)
                const pickLabel = (artist.fumi_pick.includes(',') && artist.name !== 'Knox') ? "Fumi's Picks" : "Fumi's Pick";

                // Country Text
                const countryText = getCountryName(artist);

                div.innerHTML = `
                    <div class="img-frame">
                        <img src="images/${artist.name}.jpg" alt="${artist.name}" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(artist.name)}&background=random&color=fff&size=400&bold=true';">
                    </div>
                    
                    <div class="header-row">
                        <h2 class="artist-name">${artist.name}</h2>
                        <div class="country-name">${countryText}</div>
                    </div>

                    <div class="genre-box">${genreHtml}</div>
                    
                    <div class="section-header">Reference Artists (J/K-POP)</div>
                    <p class="similar-list">${artist.similar.join(", ")}</p>

                    <div class="section-header">Essential Tracks</div>
                    <div class="track-list">
                        <span class="japan-hit-wrapper"><span class="japan-label">🇯🇵 Japan Hit:</span> <span class="track-title">${artist.song}</span></span>
                        ${trackHtml}
                        <span class="special-hit-wrapper"><span class="fumi-label">🎧 ${pickLabel}:</span> <span class="track-title">${artist.fumi_pick}</span></span>
                    </div>
                `;
                grid.appendChild(div);
            });

            section.appendChild(grid);
            contentDiv.appendChild(section);
        }
